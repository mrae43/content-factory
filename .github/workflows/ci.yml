name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PNPM_VERSION: "11"
  GEMINI_API_KEY: "ci-dummy-key"
  TAVILY_API_KEY: "ci-dummy-key"
  TEST_DB_SYNC: postgresql+psycopg2://postgres:postgres@localhost:5432/content_factory_test
  TEST_DB_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/content_factory_test
  DUMMY_DB: postgresql+asyncpg://localhost/test

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: cd apps/api && uv run --group dev ruff format . --check
      - run: cd apps/api && uv run --group dev ruff check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-python
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --project apps/api --extra test
      - run: cd apps/api && uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DB_SYNC }}
      - run: cd apps/api && uv run pytest tests/ -v -m unit --tb=short -x || [ $? -eq 5 ]
        env:
          DATABASE_URL: ${{ env.TEST_DB_ASYNC }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ env.TAVILY_API_KEY }}

  agent-tests:
    name: Agent Structure Tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --project apps/api --extra test
      - run: cd apps/api && uv run pytest tests/ -v -m agent --tb=short -x || [ $? -eq 5 ]
        env:
          DATABASE_URL: ${{ env.DUMMY_DB }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ env.TAVILY_API_KEY }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, agent-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --project apps/api --extra test
      - run: cd apps/api && uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DB_SYNC }}
      - run: cd apps/api && uv run pytest tests/ -v -m integration --tb=short -x
        env:
          DATABASE_URL: ${{ env.TEST_DB_ASYNC }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ env.TAVILY_API_KEY }}

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx nx lint web

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx nx build web

  docker-build-api:
    name: Docker Build API
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t content-factory-api:ci ./apps/api

  docker-build-web:
    name: Docker Build Web
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t content-factory-web:ci -f apps/web/Dockerfile .
